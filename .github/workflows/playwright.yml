name: Playwright Staging

on:
  workflow_dispatch:
    inputs:
      run_auth_mutations:
        description: Run staging login and 2FA delivery checks
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '41 6 * * 3'

permissions:
  contents: read

concurrency:
  group: playwright-staging
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    environment: staging
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      PLAYWRIGHT_AUTH_MUTATIONS: ${{ inputs.run_auth_mutations || false }}
      PLAYWRIGHT_TEST_EMAIL: ${{ secrets.PLAYWRIGHT_TEST_EMAIL }}
      PLAYWRIGHT_TEST_PASSWORD: ${{ secrets.PLAYWRIGHT_TEST_PASSWORD }}
    steps:
      - name: Check staging configuration
        run: test -n "$SITE_URL"

      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Run staging browser checks
        run: npm run e2e:ci

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
