name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Scan tracked files for secrets
        run: npm run scan:secrets

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run tests with coverage thresholds
        env:
          NODE_ENV: test
          DISABLE_DB_FALLBACK: '1'
        run: npm run test:coverage

      - name: Build application
        env:
          NODE_ENV: production
          NEXT_PUBLIC_SITE_URL: https://www.example.invalid
          NEXTAUTH_URL: https://www.example.invalid
          NEXTAUTH_SECRET: ci-only-nextauth-secret-not-for-production
          ENCRYPTION_KEY: Y2ktb25seS1lbmNyeXB0aW9uLWtleS0zMmJ5dGVzIQ==
          CF_TURNSTILE_SECRET: ci-only-turnstile-secret
          NEXT_PUBLIC_CF_TURNSTILE_SITEKEY: 1x00000000000000000000AA
          NEXT_PUBLIC_S3_BUCKET: ci-test
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_USER: ci
          DB_NAME: ci
          REDIS_URL: redis://127.0.0.1:6379
          MINIO_HOST: 127.0.0.1
          MINIO_PORT: '9000'
          MINIO_ACCESS_KEY: ci-only-access-key
          MINIO_SECRET_KEY: ci-only-secret-key
        run: npm run build

  redis-integration:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run integration tests with Redis
        env:
          NODE_ENV: test
          REDIS_URL: redis://127.0.0.1:6379
          DISABLE_DB_FALLBACK: '1'
        run: npm run test:integration
