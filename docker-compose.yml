services:
  kf8fvd:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        NODE_ENV: ${NODE_ENV:-production}
        NEXT_PUBLIC_CF_TURNSTILE_SITEKEY: ${NEXT_PUBLIC_CF_TURNSTILE_SITEKEY:-}
        NEXT_PUBLIC_MINIO_BASE_URL: ${NEXT_PUBLIC_MINIO_BASE_URL:-https://kf8fvd.com/s3}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://kf8fvd.com}
        NEXT_PUBLIC_S3_BUCKET: ${NEXT_PUBLIC_S3_BUCKET:-kf8fvd}
        NEXT_PUBLIC_UMAMI_HOST_URL: ${NEXT_PUBLIC_UMAMI_HOST_URL:-}
        NEXT_PUBLIC_UMAMI_SCRIPT_URL: ${NEXT_PUBLIC_UMAMI_SCRIPT_URL:-}
        NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-}
        NEXT_PUBLIC_UMAMI_DOMAINS: ${NEXT_PUBLIC_UMAMI_DOMAINS:-}
    image: kf8fvd-app:${APP_IMAGE_TAG:-upgrade-2026-08-09}
    container_name: kf8fvd
    restart: always
    mem_limit: 1g
    mem_reservation: 256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DB_HOST: ${DOCKER_DB_HOST:-host.docker.internal}
      DB_PORT: ${DOCKER_DB_PORT:-3306}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      REDIS_URL: ${DOCKER_REDIS_URL:-redis://host.docker.internal:6379}
      REDIS_HOST: ${DOCKER_REDIS_HOST:-host.docker.internal}
      REDIS_PORT: ${DOCKER_REDIS_PORT:-6379}
      MINIO_HOST: ${DOCKER_MINIO_HOST:-host.docker.internal}
      MINIO_PORT: ${DOCKER_MINIO_PORT:-9000}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-0}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      NEXT_PUBLIC_S3_BUCKET: ${NEXT_PUBLIC_S3_BUCKET:-kf8fvd}
      NEXT_PUBLIC_MINIO_BASE_URL: ${NEXT_PUBLIC_MINIO_BASE_URL:-https://kf8fvd.com/s3}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://kf8fvd.com}
      NEXT_PUBLIC_UMAMI_HOST_URL: ${NEXT_PUBLIC_UMAMI_HOST_URL:-}
      NEXT_PUBLIC_UMAMI_SCRIPT_URL: ${NEXT_PUBLIC_UMAMI_SCRIPT_URL:-}
      NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-}
      NEXT_PUBLIC_UMAMI_DOMAINS: ${NEXT_PUBLIC_UMAMI_DOMAINS:-}
      UMAMI_SERVER_URL: ${DOCKER_UMAMI_SERVER_URL:-http://umami:3000}
      UMAMI_POSTGRES_HOST: ${DOCKER_UMAMI_POSTGRES_HOST:-umami-db}
      UMAMI_POSTGRES_PORT: ${DOCKER_UMAMI_POSTGRES_PORT:-5432}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://kf8fvd.com}
      INTERNAL_APP_ORIGIN: ${DOCKER_INTERNAL_APP_ORIGIN:-http://kf8fvd:3000}
      CSP_REPORT_ONLY: ${CSP_REPORT_ONLY:-0}
      CSP_ALLOW_INLINE: ${CSP_ALLOW_INLINE:-0}
    entrypoint: ["node", "/usr/local/bin/docker-entrypoint.js"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      umami:
        condition: service_healthy
    networks:
      - kf8fvd-net

  db:
    image: mysql@sha256:da906917ca4ace3ba55538b7c2ee97a9bc865ef14a4b6920b021f0249d603f3d
    container_name: kf8fvd-mysql
    restart: always
    mem_limit: 1g
    mem_reservation: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      kf8fvd-net:
        aliases:
          - db

  redis:
    image: redis@sha256:8b81dd37ff027bec4e516d41acfbe9fe2460070dc6d4a4570a2ac5b9d59df065
    container_name: kf8fvd-redis
    restart: always
    mem_limit: 256m
    mem_reservation: 64m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      kf8fvd-net:
        aliases:
          - redis

  minio:
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: kf8fvd-minio
    restart: always
    mem_limit: 512m
    mem_reservation: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command:
      - server
      - /data
      - --console-address
      - ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - ./data/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      kf8fvd-net:
        aliases:
          - minio

  proxy:
    image: nginx@sha256:f46cb72c7df02710e693e863a983ac42f6a9579058a59a35f1ae36c9958e4ce0
    container_name: kf8fvd-proxy
    restart: always
    mem_limit: 128m
    mem_reservation: 64m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/cloudflare/certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "--header=Host: www.kf8fvd.com", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      kf8fvd:
        condition: service_healthy
      minio:
        condition: service_healthy
      umami:
        condition: service_healthy
    networks:
      kf8fvd-net:
        aliases:
          - proxy

  tunnel:
    image: cloudflare/cloudflared@sha256:6d91c121b803126f7a5344005d17a9324788fc09d305b6e2560ec6040a7ae283
    container_name: kf8fvd-tunnel
    restart: always
    mem_limit: 128m
    mem_reservation: 64m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CF_TUNNEL_TOKEN}
    depends_on:
      proxy:
        condition: service_healthy
    networks:
      kf8fvd-net:
        aliases:
          - tunnel

  umami-db:
    image: postgres@sha256:20edbde7749f822887a1a022ad526fde0a47d6b2be9a8364433605cf65099416
    container_name: kf8fvd-umami-db
    restart: always
    mem_limit: 384m
    mem_reservation: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_DB: ${UMAMI_POSTGRES_DB:-umami}
      POSTGRES_USER: ${UMAMI_POSTGRES_USER:-umami}
      POSTGRES_PASSWORD: ${UMAMI_POSTGRES_PASSWORD:?UMAMI_POSTGRES_PASSWORD is required}
    volumes:
      - umami-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${UMAMI_POSTGRES_USER:-umami} -d ${UMAMI_POSTGRES_DB:-umami}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kf8fvd-net

  umami:
    image: docker.umami.is/umami-software/umami@sha256:28f263fe06f79ebffa5a6a6e9bd33b7a278e9342a88e0bdac812416c9f9e4361
    container_name: kf8fvd-umami
    restart: always
    mem_limit: 512m
    mem_reservation: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      DATABASE_URL: postgresql://${UMAMI_POSTGRES_USER:-umami}:${UMAMI_POSTGRES_PASSWORD:?UMAMI_POSTGRES_PASSWORD is required}@umami-db:5432/${UMAMI_POSTGRES_DB:-umami}
      APP_SECRET: ${UMAMI_APP_SECRET:?UMAMI_APP_SECRET is required}
      TRACKER_SCRIPT_NAME: ${UMAMI_TRACKER_SCRIPT_NAME:-script.js}
      CLIENT_IP_HEADER: ${UMAMI_CLIENT_IP_HEADER:-x-forwarded-for}
    depends_on:
      umami-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/heartbeat').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - kf8fvd-net

networks:
  kf8fvd-net:
    driver: bridge

volumes:
  umami-postgres:
